name: Release

# Build all platform artifacts and attach them to a GitHub release.
# Trigger: push a tag, e.g.  v2.6.4
# The package version defaults to the tag (v-prefix stripped); the bundled
# core version travels with resources/ so deb naming stays in sync.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {} # manual run for testing (build only, no release)

permissions:
  contents: write # required to create the release and upload assets

jobs:
  windows-desktop:
    name: Windows desktop (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npx vue-tsc --noEmit
          npx vite build

      - name: Embed UAC manifest + icon (.syso)
        # Without the requireAdministrator manifest the exe starts
        # unprivileged on other machines (no UAC prompt) and the core
        # cannot create the TUN adapter. pwsh: single line, & call operator.
        run: |
          go install github.com/akavel/rsrc@v0.10.2
          & "$(go env GOPATH)/bin/rsrc.exe" -manifest build/windows/easytier-pro-gui.exe.manifest -ico build/windows/icon.ico -o rsrc_windows_amd64.syso

      - name: Build desktop exe
        env:
          CGO_ENABLED: '0' # wails v2 windows frontend is pure Go — no mingw needed
        run: >
          go build -trimpath -tags "desktop,production"
          -ldflags "-s -w -H windowsgui"
          -o build/bin/easytier-pro-gui.exe .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: easytier-pro-gui-windows-x64
          path: build/bin/easytier-pro-gui.exe
          if-no-files-found: error

  linux-server:
    name: Linux server (${{ matrix.arch }})
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        include:
          - arch: amd64
            goarch: amd64
          - arch: arm64
            goarch: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npx vite build

      - name: Build headless server
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: >
          go build -trimpath -tags headless -ldflags "-s -w"
          -o build/bin/easytier-pro-server-linux-${{ matrix.arch }} .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: easytier-pro-server-linux-${{ matrix.arch }}
          path: build/bin/easytier-pro-server-linux-${{ matrix.arch }}
          if-no-files-found: error

  linux-debs:
    name: Debian packages (server + GUI)
    runs-on: ubuntu-22.04
    needs: [linux-server]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install GTK / WebKit2GTK toolchain (Linux GUI build)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libwebkit2gtk-4.0-dev libayatana-appindicator3-dev

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npx vite build

      - name: Build Linux GUI binary
        env:
          CGO_ENABLED: '1'
        run: >
          go build -trimpath -tags "desktop,production" -ldflags "-s -w"
          -o build/bin/easytier-pro-gui-linux-amd64 .

      - name: Download server binaries from the matrix job
        uses: actions/download-artifact@v4
        with:
          pattern: easytier-pro-server-linux-*
          path: build/bin
          merge-multiple: true

      - name: Assemble deb packages (mkdeb)
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          VER="${VERSION#v}"
          chmod +x build/bin/easytier-pro-server-linux-*
          go build -o build/mkdeb.bin ./build/mkdeb  # binary must differ from the source dir
          ./build/mkdeb.bin -out "build/bin/easytier-pro_${VER}_amd64.deb" \
            -bin build/bin/easytier-pro-server-linux-amd64 -arch amd64 -version "$VER"
          ./build/mkdeb.bin -out "build/bin/easytier-pro_${VER}_arm64.deb" \
            -bin build/bin/easytier-pro-server-linux-arm64 -arch arm64 -version "$VER"
          ./build/mkdeb.bin -out "build/bin/easytier-pro-gui_${VER}_amd64.deb" \
            -bin build/bin/easytier-pro-gui-linux-amd64 -arch amd64 -version "$VER" \
            -mode gui -ico build/appicon.png
          ./build/mkdeb.bin -list "build/bin/easytier-pro_${VER}_amd64.deb"
          ./build/mkdeb.bin -list "build/bin/easytier-pro-gui_${VER}_amd64.deb"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: debs
          path: build/bin/*.deb
          if-no-files-found: error

  release:
    name: Attach to GitHub release
    runs-on: ubuntu-latest
    needs: [windows-desktop, linux-debs]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release and upload assets (gh CLI, no third-party actions)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          cd dist
          # raw server binaries keep their names; give the exe a versioned name
          VER="${TAG#v}"
          mv easytier-pro-gui.exe "easytier-pro-gui_${VER}_windows_amd64.exe"
          sha256sum * > sha256sums.txt
          gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "EasyTier Pro $TAG" --generate-notes             || gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber             easytier-pro-gui_${VER}_windows_amd64.exe             sha256sums.txt             easytier-pro_*_amd64.deb easytier-pro_*_arm64.deb easytier-pro-gui_*_amd64.deb             easytier-pro-server-linux-amd64             easytier-pro-server-linux-arm64
